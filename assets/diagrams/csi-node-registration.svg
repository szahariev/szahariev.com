<svg role="img" aria-labelledby="csi-node-registration-title csi-node-registration-desc" xmlns="http://www.w3.org/2000/svg" style="background: transparent; background-color: transparent; color-scheme: light;" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="823px" height="425px" viewBox="0 0 823 425">
  <title id="csi-node-registration-title">CSI node registration and driver sockets</title>
  <desc id="csi-node-registration-desc">The node driver registrar creates a registration socket under the actual kubelet root. Kubelet discovers the driver there and uses a separate CSI socket to call the node plugin. The host endpoint and the path inside the Pod are different views of that socket.</desc><defs/><g><g data-cell-id="0"><g data-cell-id="1"><g data-cell-id="title"><g><rect x="0" y="0" width="820" height="32" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="var(--frost, #eef1f5)" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="20px" style="fill: var(--frost, #eef1f5);"><text x="2" y="25">Kubelet reaches the CSI driver through two sockets</text></g></g></g><g data-cell-id="subtitle"><g><rect x="0" y="39" width="820" height="25" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="var(--mist, #8896a8)" font-family="Helvetica" text-anchor="start" font-size="14px" style="fill: var(--mist, #8896a8);"><text x="2" y="57.5">Registration identifies the endpoint. CSI calls use a separate socket.</text></g></g></g><g data-cell-id="pod-boundary"><g><rect x="0" y="90" width="260" height="280" rx="10.4" ry="10.4" fill="none" stroke="var(--steel, #2c3a52)" stroke-width="1.5" pointer-events="all" style="stroke: var(--steel, #2c3a52);"/></g></g><g data-cell-id="pod-label"><g><rect x="20" y="100" width="220" height="22" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="var(--accent-soft, #a8d2ff)" font-family="Menlo" font-weight="bold" text-anchor="start" font-size="11px" style="fill: var(--accent-soft, #a8d2ff);"><text x="22" y="115.5">CSI NODE POD</text></g></g></g><g data-cell-id="host-boundary"><g><rect x="290" y="90" width="320" height="280" rx="11.2" ry="11.2" fill="none" stroke="var(--steel, #2c3a52)" stroke-width="1.5" pointer-events="all" style="stroke: var(--steel, #2c3a52);"/></g></g><g data-cell-id="host-label"><g><rect x="310" y="100" width="280" height="22" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="var(--accent-soft, #a8d2ff)" font-family="Menlo" font-weight="bold" text-anchor="start" font-size="11px" style="fill: var(--accent-soft, #a8d2ff);"><text x="312" y="115.5">HOST FILESYSTEM</text></g></g></g><g data-cell-id="registrar"><g><rect x="20" y="140" width="220" height="55" rx="6.6" ry="6.6" fill="var(--obsidian, #141927)" stroke="var(--accent, #4f8fdc)" stroke-width="1.5" pointer-events="all" style="fill: var(--obsidian, #141927); stroke: var(--accent, #4f8fdc);"/></g><g><g fill="var(--frost, #eef1f5)" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="15px" style="fill: var(--frost, #eef1f5);"><text x="130" y="174">Node driver registrar</text></g></g></g><g data-cell-id="plugin"><g><rect x="20" y="275" width="220" height="55" rx="6.6" ry="6.6" fill="var(--obsidian, #141927)" stroke="var(--accent, #4f8fdc)" stroke-width="1.5" pointer-events="all" style="fill: var(--obsidian, #141927); stroke: var(--accent, #4f8fdc);"/></g><g><g fill="var(--frost, #eef1f5)" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="15px" style="fill: var(--frost, #eef1f5);"><text x="130" y="309">CSI node plugin</text></g></g></g><g data-cell-id="registration-socket"><g><rect x="310" y="140" width="280" height="55" rx="6.6" ry="6.6" fill="var(--obsidian, #141927)" stroke="var(--steel, #2c3a52)" stroke-width="1.5" pointer-events="all" style="fill: var(--obsidian, #141927); stroke: var(--steel, #2c3a52);"/></g><g><g fill="var(--frost, #eef1f5)" font-family="Menlo" text-anchor="middle" font-size="13px" style="fill: var(--frost, #eef1f5);"><text x="450" y="165">plugins_registry/</text><text x="450" y="181">&lt;driver&gt;-reg.sock</text></g></g></g><g data-cell-id="csi-socket"><g><rect x="310" y="275" width="280" height="55" rx="6.6" ry="6.6" fill="var(--obsidian, #141927)" stroke="var(--steel, #2c3a52)" stroke-width="1.5" pointer-events="all" style="fill: var(--obsidian, #141927); stroke: var(--steel, #2c3a52);"/></g><g><g fill="var(--frost, #eef1f5)" font-family="Menlo" text-anchor="middle" font-size="13px" style="fill: var(--frost, #eef1f5);"><text x="450" y="308">plugins/&lt;driver&gt;/csi.sock</text></g></g></g><g data-cell-id="root-note"><g><rect x="310" y="210" width="280" height="45" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="var(--mist, #8896a8)" font-family="Helvetica" text-anchor="middle" font-size="13px" style="fill: var(--mist, #8896a8);"><text x="450" y="230">Paths start at the actual</text><text x="450" y="246">kubelet root on the node</text></g></g></g><g data-cell-id="kubelet"><g><rect x="680" y="200" width="140" height="70" rx="8.4" ry="8.4" fill="var(--body-glow, #172b47)" stroke="var(--accent-strong, #71b0f5)" stroke-width="2" pointer-events="all" style="fill: var(--body-glow, #172b47); stroke: var(--accent-strong, #71b0f5);"/></g><g><g fill="var(--frost, #eef1f5)" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="17px" style="fill: var(--frost, #eef1f5);"><text x="750" y="242.5">Kubelet</text></g></g></g><g data-cell-id="registrar-creates"><g><path d="M 240 167 L 300.82 167" fill="none" stroke="var(--accent-strong, #71b0f5)" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: var(--accent-strong, #71b0f5);"/><path d="M 308.32 167 L 300.82 170.75 L 300.82 163.25 Z" fill="var(--accent-strong, #71b0f5)" stroke="var(--accent-strong, #71b0f5)" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: var(--accent-strong, #71b0f5); stroke: var(--accent-strong, #71b0f5);"/></g></g><g data-cell-id="registrar-to-plugin"><g><path d="M 130 195 L 130 265.82" fill="none" stroke="var(--mist, #8896a8)" stroke-width="1.5" stroke-miterlimit="10" stroke-dasharray="4.5 4.5" pointer-events="stroke" style="stroke: var(--mist, #8896a8);"/><path d="M 130 273.32 L 126.25 265.82 L 133.75 265.82 Z" fill="var(--mist, #8896a8)" stroke="var(--mist, #8896a8)" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: var(--mist, #8896a8); stroke: var(--mist, #8896a8);"/></g></g><g data-cell-id="identity-label"><g><rect x="45" y="221" width="170" height="24" fill="var(--obsidian, #141927)" stroke="none" pointer-events="all" style="fill: var(--obsidian, #141927);"/></g><g><g fill="var(--mist, #8896a8)" font-family="Helvetica" text-anchor="middle" font-size="12px" style="fill: var(--mist, #8896a8);"><text x="130" y="238">read driver identity</text></g></g></g><g data-cell-id="discover"><g><path d="M 680 220 L 597.91 171.66" fill="none" stroke="var(--accent-strong, #71b0f5)" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: var(--accent-strong, #71b0f5);"/><path d="M 591.45 167.85 L 599.81 168.43 L 596 174.89 Z" fill="var(--accent-strong, #71b0f5)" stroke="var(--accent-strong, #71b0f5)" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: var(--accent-strong, #71b0f5); stroke: var(--accent-strong, #71b0f5);"/></g></g><g data-cell-id="discover-label"><g><rect x="615" y="155" width="65" height="22" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="var(--mist, #8896a8)" font-family="Helvetica" text-anchor="middle" font-size="12px" style="fill: var(--mist, #8896a8);"><text x="647.5" y="171">discover</text></g></g></g><g data-cell-id="call-csi"><g><path d="M 680 250 L 597.95 297.41" fill="none" stroke="var(--accent-strong, #71b0f5)" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: var(--accent-strong, #71b0f5);"/><path d="M 591.45 301.16 L 596.07 294.16 L 599.82 300.66 Z" fill="var(--accent-strong, #71b0f5)" stroke="var(--accent-strong, #71b0f5)" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: var(--accent-strong, #71b0f5); stroke: var(--accent-strong, #71b0f5);"/></g></g><g data-cell-id="call-label"><g><rect x="615" y="300" width="65" height="22" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="var(--mist, #8896a8)" font-family="Helvetica" text-anchor="middle" font-size="12px" style="fill: var(--mist, #8896a8);"><text x="647.5" y="316">CSI calls</text></g></g></g><g data-cell-id="socket-to-plugin"><g><path d="M 310 302 L 249.18 302" fill="none" stroke="var(--accent-strong, #71b0f5)" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: var(--accent-strong, #71b0f5);"/><path d="M 241.68 302 L 249.18 298.25 L 249.18 305.75 Z" fill="var(--accent-strong, #71b0f5)" stroke="var(--accent-strong, #71b0f5)" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: var(--accent-strong, #71b0f5); stroke: var(--accent-strong, #71b0f5);"/></g></g><g data-cell-id="local-socket"><g><rect x="15" y="335" width="230" height="22" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="var(--mist, #8896a8)" font-family="Helvetica" text-anchor="middle" font-size="12px" style="fill: var(--mist, #8896a8);"><text x="130" y="351">Inside the Pod: /csi/csi.sock</text></g></g></g><g data-cell-id="footer"><g><rect x="0" y="398" width="820" height="26" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="var(--frost, #eef1f5)" font-family="Helvetica" text-anchor="start" font-size="14px" style="fill: var(--frost, #eef1f5);"><text x="2" y="417">A running plugin does not prove kubelet can discover or reach its host endpoint.</text></g></g></g></g></g></g></svg>
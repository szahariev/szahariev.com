<svg role="img" aria-labelledby="gpu-readiness-boundaries-title gpu-readiness-boundaries-desc" xmlns="http://www.w3.org/2000/svg" style="background: transparent; background-color: transparent; color-scheme: light;" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="860px" height="405px" viewBox="0 0 860 405">
  <title id="gpu-readiness-boundaries-title">GPU readiness signals recover at different times</title>
  <desc id="gpu-readiness-boundaries-desc">Node readiness and host driver health remain green while the device plugin is absent. The plugin later becomes ready, allocatable GPU capacity returns after another delay, and only then does the pending qualification Job run and pass CUDA.</desc><defs/><g><g data-cell-id="0"><g data-cell-id="1"><g data-cell-id="title"><g><rect x="0" y="0" width="500" height="30" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="var(--frost, #eef1f5)" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="20px" style="fill: var(--frost, #eef1f5);"><text x="2" y="24">The signals recover at different times</text></g></g></g><g data-cell-id="remove-line"><g><path d="M 272 62 L 272 387" fill="none" stroke="var(--steel, #2c3a52)" stroke-width="1.5" stroke-miterlimit="10" stroke-dasharray="6 6" pointer-events="stroke" style="stroke: var(--steel, #2c3a52);"/></g></g><g data-cell-id="restore-line"><g><path d="M 560 62 L 560 387" fill="none" stroke="var(--steel, #2c3a52)" stroke-width="1.5" stroke-miterlimit="10" stroke-dasharray="6 6" pointer-events="stroke" style="stroke: var(--steel, #2c3a52);"/></g></g><g data-cell-id="remove-label"><g><rect x="212" y="38" width="120" height="22" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="var(--mist, #8896a8)" font-family="Menlo" text-anchor="middle" font-size="11px" style="fill: var(--mist, #8896a8);"><text x="272" y="53.5">plugin removed</text></g></g></g><g data-cell-id="restore-label"><g><rect x="500" y="38" width="120" height="22" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="var(--mist, #8896a8)" font-family="Menlo" text-anchor="middle" font-size="11px" style="fill: var(--mist, #8896a8);"><text x="560" y="53.5">plugin ready</text></g></g></g><g data-cell-id="node-label"><g><rect x="0" y="81" width="150" height="42" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="var(--frost, #eef1f5)" font-family="Helvetica" font-weight="bold" text-anchor="end" font-size="14px" style="fill: var(--frost, #eef1f5);"><text x="148" y="108">Node Ready</text></g></g></g><g data-cell-id="driver-label"><g><rect x="0" y="141" width="150" height="42" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="var(--frost, #eef1f5)" font-family="Helvetica" font-weight="bold" text-anchor="end" font-size="14px" style="fill: var(--frost, #eef1f5);"><text x="148" y="168">Host driver</text></g></g></g><g data-cell-id="plugin-label"><g><rect x="0" y="201" width="150" height="42" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="var(--frost, #eef1f5)" font-family="Helvetica" font-weight="bold" text-anchor="end" font-size="14px" style="fill: var(--frost, #eef1f5);"><text x="148" y="228">Device plugin</text></g></g></g><g data-cell-id="alloc-label"><g><rect x="0" y="261" width="150" height="42" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="var(--frost, #eef1f5)" font-family="Helvetica" font-weight="bold" text-anchor="end" font-size="14px" style="fill: var(--frost, #eef1f5);"><text x="148" y="288">Allocatable GPU</text></g></g></g><g data-cell-id="job-label"><g><rect x="0" y="321" width="150" height="42" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="var(--frost, #eef1f5)" font-family="Helvetica" font-weight="bold" text-anchor="end" font-size="14px" style="fill: var(--frost, #eef1f5);"><text x="148" y="348">CUDA Job</text></g></g></g><g data-cell-id="node-true"><g><rect x="170" y="81" width="680" height="42" rx="5.04" ry="5.04" fill="var(--body-glow, #172b47)" stroke="var(--accent, #4f8fdc)" stroke-width="1.5" pointer-events="all" style="fill: var(--body-glow, #172b47); stroke: var(--accent, #4f8fdc);"/></g><g><g fill="var(--frost, #eef1f5)" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="13px" style="fill: var(--frost, #eef1f5);"><text x="510" y="107.5">True throughout</text></g></g></g><g data-cell-id="driver-healthy"><g><rect x="170" y="141" width="680" height="42" rx="5.04" ry="5.04" fill="var(--body-glow, #172b47)" stroke="var(--accent, #4f8fdc)" stroke-width="1.5" pointer-events="all" style="fill: var(--body-glow, #172b47); stroke: var(--accent, #4f8fdc);"/></g><g><g fill="var(--frost, #eef1f5)" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="13px" style="fill: var(--frost, #eef1f5);"><text x="510" y="167.5">Healthy throughout</text></g></g></g><g data-cell-id="plugin-before"><g><rect x="170" y="201" width="90" height="42" rx="5.04" ry="5.04" fill="var(--obsidian, #141927)" stroke="var(--steel, #2c3a52)" stroke-width="1.5" pointer-events="all" style="fill: var(--obsidian, #141927); stroke: var(--steel, #2c3a52);"/></g><g><g fill="var(--frost, #eef1f5)" font-family="Helvetica" text-anchor="middle" font-size="13px" style="fill: var(--frost, #eef1f5);"><text x="215" y="227.5">Ready</text></g></g></g><g data-cell-id="plugin-absent"><g><rect x="284" y="201" width="264" height="42" rx="5.04" ry="5.04" fill="var(--obsidian, #141927)" stroke="var(--steel, #2c3a52)" stroke-width="1.5" pointer-events="all" style="fill: var(--obsidian, #141927); stroke: var(--steel, #2c3a52);"/></g><g><g fill="var(--mist, #8896a8)" font-family="Helvetica" text-anchor="middle" font-size="13px" style="fill: var(--mist, #8896a8);"><text x="416" y="227.5">Absent</text></g></g></g><g data-cell-id="plugin-after"><g><rect x="572" y="201" width="278" height="42" rx="5.04" ry="5.04" fill="var(--body-glow, #172b47)" stroke="var(--accent, #4f8fdc)" stroke-width="1.5" pointer-events="all" style="fill: var(--body-glow, #172b47); stroke: var(--accent, #4f8fdc);"/></g><g><g fill="var(--frost, #eef1f5)" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="13px" style="fill: var(--frost, #eef1f5);"><text x="711" y="227.5">Ready</text></g></g></g><g data-cell-id="alloc-one-before"><g><rect x="170" y="261" width="150" height="42" rx="5.04" ry="5.04" fill="var(--obsidian, #141927)" stroke="var(--steel, #2c3a52)" stroke-width="1.5" pointer-events="all" style="fill: var(--obsidian, #141927); stroke: var(--steel, #2c3a52);"/></g><g><g fill="var(--frost, #eef1f5)" font-family="Menlo" text-anchor="middle" font-size="13px" style="fill: var(--frost, #eef1f5);"><text x="245" y="287.5">1</text></g></g></g><g data-cell-id="alloc-zero"><g><rect x="332" y="261" width="330" height="42" rx="5.04" ry="5.04" fill="var(--obsidian, #141927)" stroke="var(--steel, #2c3a52)" stroke-width="1.5" pointer-events="all" style="fill: var(--obsidian, #141927); stroke: var(--steel, #2c3a52);"/></g><g><g fill="var(--mist, #8896a8)" font-family="Menlo" text-anchor="middle" font-size="13px" style="fill: var(--mist, #8896a8);"><text x="497" y="287.5">0</text></g></g></g><g data-cell-id="alloc-one-after"><g><rect x="674" y="261" width="176" height="42" rx="5.04" ry="5.04" fill="var(--body-glow, #172b47)" stroke="var(--accent, #4f8fdc)" stroke-width="1.5" pointer-events="all" style="fill: var(--body-glow, #172b47); stroke: var(--accent, #4f8fdc);"/></g><g><g fill="var(--frost, #eef1f5)" font-family="Menlo" font-weight="bold" text-anchor="middle" font-size="13px" style="fill: var(--frost, #eef1f5);"><text x="762" y="287.5">1</text></g></g></g><g data-cell-id="job-not-submitted"><g><rect x="170" y="321" width="150" height="42" rx="5.04" ry="5.04" fill="var(--obsidian, #141927)" stroke="var(--steel, #2c3a52)" stroke-width="1.5" pointer-events="all" style="fill: var(--obsidian, #141927); stroke: var(--steel, #2c3a52);"/></g><g><g fill="var(--mist, #8896a8)" font-family="Helvetica" text-anchor="middle" font-size="13px" style="fill: var(--mist, #8896a8);"><text x="245" y="347.5">Not submitted</text></g></g></g><g data-cell-id="job-pending"><g><rect x="332" y="321" width="330" height="42" rx="5.04" ry="5.04" fill="var(--obsidian, #141927)" stroke="var(--steel, #2c3a52)" stroke-width="1.5" pointer-events="all" style="fill: var(--obsidian, #141927); stroke: var(--steel, #2c3a52);"/></g><g><g fill="v
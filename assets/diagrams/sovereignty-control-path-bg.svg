  <title id="control-path-bg-title">Пълният път на управление в облака</title>
  <desc id="control-path-bg-desc">Заявката преминава през идентичност, авторизация и облачния API, преди да достигне инфраструктурата и данните. Доставката на софтуер, одитните доказателства и контролът върху ключовете също са част от пътя. Само инфраструктурата и данните са в границата на посоченото местоположение.</desc><defs/><g><g data-cell-id="0"><g data-cell-id="1"><g data-cell-id="title"><g><rect x="0" y="0" width="720" height="30" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="var(--frost, #eef1f5)" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="20px" style="fill: var(--frost, #eef1f5);"><text x="2" y="24">Една заявка зависи от повече от местоположението на данните</text></g></g></g><g data-cell-id="data-boundary"><g><rect x="532" y="47" width="188" height="174" rx="12.18" ry="12.18" fill="var(--body-glow, #172b47)" stroke="var(--accent, #4f8fdc)" stroke-width="1.5" stroke-dasharray="10.5 9" pointer-events="all" style="fill: var(--body-glow, #172b47); stroke: var(--accent, #4f8fdc);"/></g></g><g data-cell-id="data-boundary-label"><g><rect x="550" y="54" width="160" height="23" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="var(--accent-soft, #a8d2ff)" font-family="Menlo" font-weight="bold" text-anchor="start" font-size="10px" style="fill: var(--accent-soft, #a8d2ff);"><text x="550" y="69.5">МЕСТОПОЛОЖЕНИЕ</text></g></g></g><g data-cell-id="request-identity"><g><path d="M 82 133 L 102 133 L 86 133 L 95.76 133" fill="none" stroke="var(--accent-strong, #71b0f5)" stroke-width="2" stroke-miterlimit="10" pointer-events="stroke" style="stroke: var(--accent-strong, #71b0f5);"/><path d="M 103.76 133 L 95.76 137 L 95.76 129 Z" fill="var(--accent-strong, #71b0f5)" stroke="var(--accent-strong, #71b0f5)" stroke-width="2" stroke-miterlimit="10" pointer-events="all" style="fill: var(--accent-strong, #71b0f5); stroke: var(--accent-strong, #71b0f5);"/></g></g><g data-cell-id="identity-authorization"><g><path d="M 2
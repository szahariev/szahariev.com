<svg role="img" aria-labelledby="five-tests-bg-title five-tests-bg-desc" xmlns="http://www.w3.org/2000/svg" style="background: transparent; background-color: transparent; color-scheme: light;" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="731px" height="332px" viewBox="0 0 731 332">
  <title id="five-tests-bg-title">Пет твърдения за суверенност и техните проверки</title>
  <desc id="five-tests-bg-desc">Контролът на оператора зависи от пет твърдения: правомощията се проверяват чрез отмяна, ключовете чрез спиране на достъпа, доказателствата чрез независима проверка, непрекъснатостта чрез изключване, а изходът чрез репетиция.</desc><defs/><g><g data-cell-id="0"><g data-cell-id="1"><g data-cell-id="title"><g><rect x="4" y="0" width="400" height="30" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="var(--frost, #eef1f5)" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="20px" style="fill: var(--frost, #eef1f5);"><text x="6" y="24">Пет твърдения, пет проверки</text></g></g></g><g data-cell-id="centre-stem"><g><path d="M 364 102 L 364 123" fill="none" stroke="var(--steel, #2c3a52)" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: var(--steel, #2c3a52);"/></g></g><g data-cell-id="horizontal-branch"><g><path d="M 68 123 L 660 123" fill="none" stroke="var(--steel, #2c3a52)" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: var(--steel, #2c3a52);"/></g></g><g data-cell-id="authority-branch"><g><path d="M 68 123 L 68 145" fill="none" stroke="var(--steel, #2c3a52)" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: var(--steel, #2c3a52);"/></g></g><g data-cell-id="custody-branch"><g><path d="M 216 123 L 216 145" fill="none" stroke="var(--steel, #2c3a52)" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: var(--steel, #2c3a52);"/></g></g><g data-cell-id="evidence-branch"><g><path d="M 364 123 L 364 145" fill="none" stroke="var(--steel, #2c3a52)" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: var(--steel, #2c3a52);"/></g></g><g data-cell-id="continuity-branch"><g><path d="M 512 123 L 512 145" fill="none" stroke="var(--steel, #2c3a52)" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: var(--steel, #2c3a52);"/></g></g><g data-cell-id="exit-branch"><g><path d="M 660 123 L 660 145" fill="none" stroke="var(--steel, #2c3a52)" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: var(--steel, #2c3a52);"/></g></g><g data-cell-id="operator-control"><g><rect x="258" y="47" width="212" height="55" rx="6.6" ry="6.6" fill="var(--obsidian, #141927)" stroke="var(--accent, #4f8fdc)" stroke-width="2" pointer-events="all" style="fill: var(--obsidian, #141927); stroke: var(--accent, #4f8fdc);"/></g><g><g fill="var(--frost, #eef1f5)" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="16px" style="fill: var(--frost, #eef1f5);"><text x="364" y="81.5">Контрол на оператора</text></g></g></g><g data-cell-id="authority"><g><rect x="0" y="145" width="136" height="185" rx="10.88" ry="10.88" fill="var(--obsidian, #141927)" stroke="var(--steel, #2c3a52)" stroke-width="1.5" pointer-events="all" style="fill: var(--obsidian, #141927); stroke: var(--steel, #2c3a52);"/></g><g data-cell-id="authority-number"><g><rect x="14" y="155" width="35" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="var(--mist, #8896a8)" font-family="Menlo" font-weight="bold" text-anchor="start" font-size="11px" style="fill: var(--mist, #8896a8);"><text x="16" y="169.5">01</text></g></g></g><g data-cell-id="authority-label"><g><rect x="0" y="182" width="136" height="26" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="var(--frost, #eef1f5)" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="14px" style="fill: var(--frost, #eef1f5);"><text x="68" y="201">Правомощия</text></g></g></g><g data-cell-id="authority-verb"><g><rect x="0" y="213" width="136" height="24" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="var(--accent-soft, #a8d2ff)" font-family="Menlo" font-weight="bold" text-anchor="middle" font-size="12px" style="fill: var(--accent-soft, #a8d2ff);"><text x="68" y="230">ОТМЕНИ</text></g></g></g><g data-cell-id="authority-note"><g><rect x="8" y="253" width="120" height="60" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="var(--mist, #8896a8)" font-family="Helvetica" text-anchor="middle" font-size="10px" style="fill: var(--mist, #8896a8);"><text x="68" y="269">Може ли всеки</text><text x="68" y="281">външен достъп</text><text x="68" y="293">да се премахне?</text></g></g></g></g><g data-cell-id="key-custody"><g><rect x="148" y="145" width="136" height="185" rx="10.88" ry="10.88" fill="var(--obsidian, #141927)" stroke="var(--steel, #2c3a52)" stroke-width="1.5" pointer-events="all" style="fill: var(--obsidian, #141927); stroke: var(--steel, #2c3a52);"/></g><g data-cell-id="key-custody-number"><g><rect x="162" y="155" width="35" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="var(--mist, #8896a8)" font-family="Menlo" font-weight="bold" text-anchor="start" font-size="11px" style="fill: var(--mist, #8896a8);"><text x="164" y="169.5">02</text></g></g></g><g data-cell-id="key-custody-label"><g><rect x="148" y="182" width="136" height="26" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="var(--frost, #eef1f5)" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="14px" style="fill: var(--frost, #eef1f5);"><text x="216" y="201">Ключове</text></g></g></g><g data-cell-id="key-custody-verb"><g><rect x="148" y="213" width="136" height="24" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="var(--accent-soft, #a8d2ff)" font-family="Menlo" font-weight="bold" text-anchor="middle" font-size="12px" style="fill: var(--accent-soft, #a8d2ff);"><text x="216" y="230">ОТНЕМИ</text></g></g></g><g data-cell-id="key-custody-note"><g><rect x="156" y="253" width="120" height="60" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="var(--mist, #8896a8)" font-family="Helvetica" text-anchor="middle" font-size="10px" style="fill: var(--mist, #8896a8);"><text x="216" y="269">Може ли достъпът</text><text x="216" y="281">да бъде спрян без</text><text x="216" y="293">загуба на ключа?</text></g></g></g></g><g data-cell-id="evidence"><g><rect x="296" y="145" width="136" height="185" rx="10.88" ry="10.88" fill="var(--obsidian, #141927)" stroke="var(--steel, #2c3a52)" stroke-width="1.5" pointer-events="all" style="fill: var(--obsidian, #141927); stroke: var(--steel, #2c3a52);"/></g><g data-cell-id="evidence-number"><g><rect x="310" y="155" width="35" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="var(--mist, #8896a8)" font-family="Menlo" font-weight="bold" text-anchor="start" font-size="11px" style="fill: var(--mist, #8896a8);"><text x="312" y="169.5">03</text></g></g></g><g data-cell-id="evidence-label"><g><rect x="296" y="182" width="136" height="26" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="var(--frost, #eef1f5)" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="13px" style="fill: var(--frost, #eef1f5);"><text x="364" y="200.5">Доказателства</text></g></g></g><g data-cell-id="evidence-verb"><g><rect x="296" y="213" width="136" height="24" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="var(--accent-soft, #a8d2ff)" font-family="Menlo" font-weight="bold" text-anchor="middle" font-size="12px" style="fill: var(--accent-soft, #a8d2ff);"><text x="364" y="230">ПРОВЕРИ</text></g></g></g><g data-cell-id="evidence-note"><g><rect x="304" y="253" width="120" height="60" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="var(--mist, #8896a8)" font-family="Helvetica" text-anchor="middle" font-size="10px" style="fill: var(--mist, #8896a8);"><text x="364" y="269">Може ли запазено</text><text x="364" y="281">копие да се провери</text><text x="364" y="293">независимо?</text></g></g></g></g><g data-cell-id="continuity"><g><rect x="444" y="145" width="136" height="185" rx="10.88" ry="10.88" fill="var(--obsidian, #141927)" stroke="var(--steel, #2c3a52)" stroke-width="1.5" pointer-events="all" style="fill: var(--obsidian, #141927); stroke: var(--steel, #2c3a52);"/></g><g data-cell-id="continuity-number"><g><rect x="458" y="155" width="35" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="var(--mist, #8896a8)" font-family="Menlo" font-weight="bold" text-anchor="start" font-size="11px" style="fill: var(--mist, #8896a8);"><text x="460" y="169.5">04</text></g></g></g><g data-cell-id="continuity-label"><g><rect x="444" y="182" width="136" height="26" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="var(--frost, #eef1f5)" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="12px" style="fill: var(--frost, #eef1f5);"><text x="512" y="200">Непрекъснатост</text></g></g></g><g data-cell-id="continuity-verb"><g><rect x="444" y="213" width="136" height="24" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="var(--accent-soft, #a8d2ff)" font-family="Menlo" font-weight="bold" text-anchor="middle" font-size="12px" style="fill: var(--accent-soft, #a8d2ff);"><text x="512" y="230">ИЗКЛЮЧИ</text></g></g></g><g data-cell-id="continuity-note"><g><rect x="452" y="253" width="120" height="60" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="var(--mist, #8896a8)" font-family="Helvetica" text-anchor="middle" font-size="10px" style="fill: var(--mist, #8896a8);"><text x="512" y="269">Какво продължава</text><text x="512" y="281">да работи без</text><text x="512" y="293">външни услуги?</text></g></g></g></g><g data-cell-id="exit"><g><rect x="592" y="145" width="136" height="185" rx="10.88" ry="10.88" fill="var(--obsidian, #141927)" stroke="var(--steel, #2c3a52)" stroke-width="1.5" pointer-events="all" style="fill: var(--obsidian, #141927); stroke: var(--steel, #2c3a52);"/></g><g data-cell-id="exit-number"><g><rect x="606" y="155" width="35" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="var(--mist, #8896a8)" font-family="Menlo" font-weight="bold" text-anchor="start" font-size="11px" style="fill: var(--mist, #8896a8);"><text x="608" y="169.5">05</text></g></g></g><g data-cell-id="exit-label"><g><rect x="592" y="182" width="136" height="26" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="var(--frost, #eef1f5)" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="14px" style="fill: var(--frost, #eef1f5);"><text x="660" y="201">Изход</text></g></g></g><g data-cell-id="exit-verb"><g><rect x="592" y="213" width="136" height="24" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="var(--accent-soft, #a8d2ff)" font-family="Menlo" font-weight="bold" text-anchor="middle" font-size="11px" style="fill: var(--accent-soft, #a8d2ff);"><text x="660" y="229.5">РЕПЕТИРАЙ</text></g></g></g><g data-cell-id="exit-note"><g><rect x="600" y="253" width="120" height="60" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="var(--mist, #8896a8)" font-family="Helvetica" text-anchor="middle" font-size="10px" style="fill: var(--mist, #8896a8);"><text x="660" y="269">Може ли състоянието</text><text x="660" y="281">да се премести, а</text><text x="660" y="293">старият достъп</text><text x="660" y="305">да се отмени?</text></g></g></g></g></g></g></g></svg>
<svg role="img" aria-labelledby="five-tests-title five-tests-desc" xmlns="http://www.w3.org/2000/svg" style="background: transparent; background-color: transparent; color-scheme: light;" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="731px" height="332px" viewBox="0 0 731 332">
  <title id="five-tests-title">Five sovereignty claims and their tests</title>
  <desc id="five-tests-desc">Operator control depends on five claims: authority is tested by revocation, key custody by withholding access, evidence by independent verification, continuity by disconnection and exit by rehearsal.</desc><defs/><g><g data-cell-id="0"><g data-cell-id="1"><g data-cell-id="title"><g><rect x="4" y="0" width="350" height="30" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="var(--frost, #eef1f5)" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="20px" style="fill: var(--frost, #eef1f5);"><text x="6" y="24">Five claims, five tests</text></g></g></g><g data-cell-id="centre-stem"><g><path d="M 364 102 L 364 123" fill="none" stroke="var(--steel, #2c3a52)" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: var(--steel, #2c3a52);"/></g></g><g data-cell-id="horizontal-branch"><g><path d="M 68 123 L 660 123" fill="none" stroke="var(--steel, #2c3a52)" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: var(--steel, #2c3a52);"/></g></g><g data-cell-id="authority-branch"><g><path d="M 68 123 L 68 145" fill="none" stroke="var(--steel, #2c3a52)" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: var(--steel, #2c3a52);"/></g></g><g data-cell-id="custody-branch"><g><path d="M 216 123 L 216 145" fill="none" stroke="var(--steel, #2c3a52)" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: var(--steel, #2c3a52);"/></g></g><g data-cell-id="evidence-branch"><g><path d="M 364 123 L 364 145" fill="none" stroke="var(--steel, #2c3a52)" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: var(--steel, #2c3a52);"/></g></g><g data-cell-id="continuity-branch"><g><path d="M 512 123 L 512 145" fill="none" stroke="var(--steel, #2c3a52)" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: var(--steel, #2c3a52);"/></g></g><g data-cell-id="exit-branch"><g><path d="M 660 123 L 660 145" fill="none" stroke="var(--steel, #2c3a52)" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: var(--steel, #2c3a52);"/></g></g><g data-cell-id="operator-control"><g><rect x="258" y="47" width="212" height="55" rx="6.6" ry="6.6" fill="var(--obsidian, #141927)" stroke="var(--accent, #4f8fdc)" stroke-width="2" pointer-events="all" style="fill: var(--obsidian, #141927); stroke: var(--accent, #4f8fdc);"/></g><g><g fill="var(--frost, #eef1f5)" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="17px" style="fill: var(--frost, #eef1f5);"><text x="364" y="82">Operator control</text></g></g></g><g data-cell-id="authority"><g><rect x="0" y="145" width="136" height="185" rx="10.88" ry="10.88" fill="var(--obsidian, #141927)" stroke="var(--steel, #2c3a52)" stroke-width="1.5" pointer-events="all" style="fill: var(--obsidian, #141927); stroke: var(--steel, #2c3a52);"/></g><g data-cell-id="authority-number"><g><rect x="14" y="155" width="35" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="var(--mist, #8896a8)" font-family="Menlo" font-weight="bold" text-anchor="start" font-size="11px" style="fill: var(--mist, #8896a8);"><text x="16" y="169.5">01</text></g></g></g><g data-cell-id="authority-label"><g><rect x="0" y="182" width="136" height="26" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="var(--frost, #eef1f5)" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="14px" style="fill: var(--frost, #eef1f5);"><text x="68" y="201">Authority</text></g></g></g><g data-cell-id="authority-verb"><g><rect x="0" y="213" width="136" height="24" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="var(--accent-soft, #a8d2ff)" font-family="Menlo" font-weight="bold" text-anchor="middle" font-size="12px" style="fill: var(--accent-soft, #a8d2ff);"><text x="68" y="230">REVOKE</text></g></g></g><g data-cell-id="authority-note"><g><rect x="8" y="253" width="120" height="60" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="var(--mist, #8896a8)" font-family="Helvetica" text-anchor="middle" font-size="11px" style="fill: var(--mist, #8896a8);"><text x="68" y="270">Can every</text><text x="68" y="283">external access</text><text x="68" y="296">path be removed?</text></g></g></g></g><g data-cell-id="key-custody"><g><rect x="148" y="145" width="136" height="185" rx="10.88" ry="10.88" fill="var(--obsidian, #141927)" stroke="var(--steel, #2c3a52)" stroke-width="1.5" pointer-events="all" style="fill: var(--obsidian, #141927); stroke: var(--steel, #2c3a52);"/></g><g data-cell-id="key-custody-number"><g><rect x="162" y="155" width="35" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="var(--mist, #8896a8)" font-family="Menlo" font-weight="bold" text-anchor="start" font-size="11px" style="fill: var(--mist, #8896a8);"><text x="164" y="169.5">02</text></g></g></g><g data-cell-id="key-custody-label"><g><rect x="148" y="182" width="136" height="26" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="var(--frost, #eef1f5)" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="14px" style="fill: var(--frost, #eef1f5);"><text x="216" y="201">Key custody</text></g></g></g><g data-cell-id="key-custody-verb"><g><rect x="148" y="213" width="136" height="24" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="var(--accent-soft, #a8d2ff)" font-family="Menlo" font-weight="bold" text-anchor="middle" font-size="12px" style="fill: var(--accent-soft, #a8d2ff);"><text x="216" y="230">WITHHOLD</text></g></g></g><g data-cell-id="key-custody-note"><g><rect x="156" y="253" width="120" height="60" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="var(--mist, #8896a8)" font-family="Helvetica" text-anchor="middle" font-size="11px" style="fill: var(--mist, #8896a8);"><text x="216" y="270">Can key access be</text><text x="216" y="283">withheld without</text><text x="216" y="296">losing the key?</text></g></g></g></g><g data-cell-id="evidence"><g><rect x="296" y="145" width="136" height="185" rx="10.88" ry="10.88" fill="var(--obsidian, #141927)" stroke="var(--steel, #2c3a52)" stroke-width="1.5" pointer-events="all" style="fill: var(--obsidian, #141927); stroke: var(--steel, #2c3a52);"/></g><g data-cell-id="evidence-number"><g><rect x="310" y="155" width="35" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="var(--mist, #8896a8)" font-family="Menlo" font-weight="bold" text-anchor="start" font-size="11px" style="fill: var(--mist, #8896a8);"><text x="312" y="169.5">03</text></g></g></g><g data-cell-id="evidence-label"><g><rect x="296" y="182" width="136" height="26" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="var(--frost, #eef1f5)" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="14px" style="fill: var(--frost, #eef1f5);"><text x="364" y="201">Evidence</text></g></g></g><g data-cell-id="evidence-verb"><g><rect x="296" y="213" width="136" height="24" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="var(--accent-soft, #a8d2ff)" font-family="Menlo" font-weight="bold" text-anchor="middle" font-size="12px" style="fill: var(--accent-soft, #a8d2ff);"><text x="364" y="230">VERIFY</text></g></g></g><g data-cell-id="evidence-note"><g><rect x="304" y="253" width="120" height="60" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="var(--mist, #8896a8)" font-family="Helvetica" text-anchor="middle" font-size="11px" style="fill: var(--mist, #8896a8);"><text x="364" y="270">Can a retained</text><text x="364" y="283">copy be checked</text><text x="364" y="296">independently?</text></g></g></g></g><g data-cell-id="continuity"><g><rect x="444" y="145" width="136" height="185" rx="10.88" ry="10.88" fill="var(--obsidian, #141927)" stroke="var(--steel, #2c3a52)" stroke-width="1.5" pointer-events="all" style="fill: var(--obsidian, #141927); stroke: var(--steel, #2c3a52);"/></g><g data-cell-id="continuity-number"><g><rect x="458" y="155" width="35" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="var(--mist, #8896a8)" font-family="Menlo" font-weight="bold" text-anchor="start" font-size="11px" style="fill: var(--mist, #8896a8);"><text x="460" y="169.5">04</text></g></g></g><g data-cell-id="continuity-label"><g><rect x="444" y="182" width="136" height="26" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="var(--frost, #eef1f5)" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="14px" style="fill: var(--frost, #eef1f5);"><text x="512" y="201">Continuity</text></g></g></g><g data-cell-id="continuity-verb"><g><rect x="444" y="213" width="136" height="24" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="var(--accent-soft, #a8d2ff)" font-family="Menlo" font-weight="bold" text-anchor="middle" font-size="12px" style="fill: var(--accent-soft, #a8d2ff);"><text x="512" y="230">DISCONNECT</text></g></g></g><g data-cell-id="continuity-note"><g><rect x="452" y="253" width="120" height="60" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="var(--mist, #8896a8)" font-family="Helvetica" text-anchor="middle" font-size="11px" style="fill: var(--mist, #8896a8);"><text x="512" y="270">What still works</text><text x="512" y="283">without outside</text><text x="512" y="296">services?</text></g></g></g></g><g data-cell-id="exit"><g><rect x="592" y="145" width="136" height="185" rx="10.88" ry="10.88" fill="var(--obsidian, #141927)" stroke="var(--steel, #2c3a52)" stroke-width="1.5" pointer-events="all" style="fill: var(--obsidian, #141927); stroke: var(--steel, #2c3a52);"/></g><g data-cell-id="exit-number"><g><rect x="606" y="155" width="35" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="var(--mist, #8896a8)" font-family="Menlo" font-weight="bold" text-anchor="start" font-size="11px" style="fill: var(--mist, #8896a8);"><text x="608" y="169.5">05</text></g></g></g><g data-cell-id="exit-label"><g><rect x="592" y="182" width="136" height="26" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="var(--frost, #eef1f5)" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="14px" style="fill: var(--frost, #eef1f5);"><text x="660" y="201">Exit</text></g></g></g><g data-cell-id="exit-verb"><g><rect x="592" y="213" width="136" height="24" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="var(--accent-soft, #a8d2ff)" font-family="Menlo" font-weight="bold" text-anchor="middle" font-size="12px" style="fill: var(--accent-soft, #a8d2ff);"><text x="660" y="230">REHEARSE</text></g></g></g><g data-cell-id="exit-note"><g><rect x="600" y="253" width="120" height="60" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="var(--mist, #8896a8)" font-family="Helvetica" text-anchor="middle" font-size="11px" style="fill: var(--mist, #8896a8);"><text x="660" y="270">Can state move and</text><text x="660" y="283">old access be</text><text x="660" y="296">revoked?</text></g></g></g></g></g></g></g></svg>
<!DOCTYPE html>
<html lang="{{ site.Language.Locale }}">
  <head>
    {{ partial "head.html" . }}
  </head>
  <body class="page-{{ .Kind }} section-{{ .Section | default "home" }}">
    <a class="skip-link" href="#main-content">{{ i18n "skipToContent" }}</a>
    {{ partial "header.html" . }}
    <main id="main-content">
      {{ block "main" . }}{{ end }}
    </main>
    {{ partial "footer.html" . }}
  </body>
</html>

{{ define "main" }}

    <header class="page-header">
      {{ with .Params.eyebrow }}<p class="eyebrow">{{ . }}</p>{{ end }}
      <h1>{{ .Title }}</h1>
      {{ with .Params.intro }}<p class="page-intro">{{ . }}</p>{{ end }}
    </header>
    {{ .Content }}
  </div>
{{ end }}

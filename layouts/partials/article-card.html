<article class="article-card">
  <div class="article-card-copy">
    <p class="article-meta"><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date | time.Format ":date_long" }}</time><span>{{ .ReadingTime }} {{ i18n "minRead" }}</span></p>
    <h2><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
    {{ with .Description }}<p>{{ . }}</p>{{ end }}
  </div>
  {{ $image := .Params.cardImage | default .Params.socialImage }}
  {{ with $image }}
    <div class="article-card-image" aria-hidden="true">
      <img src="{{ . | relURL }}" alt="" width="1200" height="630" loading="lazy">
    </div>
  {{ end }}
</article>
